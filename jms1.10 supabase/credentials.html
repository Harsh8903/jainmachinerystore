<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Change Credentials – Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="ios-fix.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #f7f9fb; color: #111; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: .75rem 1rem; background: #fff; border-bottom: 1px solid #e8e8e8; z-index: 50;
  }
  .header-company {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 17px; font-weight: 800; letter-spacing: -.3px;
    color: #111; text-decoration: none; white-space: nowrap;
  }
  .header-company:hover { color: #4b41e1; }
  @media (max-width: 600px) {
    .header-company { position: static; transform: none; font-size: 14px; }
  }

  .card {
    background: #fff; border-radius: .75rem; border: 1px solid #e8e8e8;
    padding: 2rem; width: 100%; max-width: 420px; margin-top: 4rem;
    box-shadow: 0 4px 24px rgba(0,0,0,.07);
  }
  .card-title {
    display: flex; align-items: center; gap: .5rem;
    font-size: 18px; font-weight: 800; margin-bottom: 1.5rem;
  }
  .field { display: flex; flex-direction: column; gap: .3rem; margin-bottom: 1rem; }
  .field label { font-size: 11px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: .04em; }
  .field input {
    border: 1.5px solid #ddd; border-radius: .4rem;
    padding: .6rem .75rem; font-size: 14px; font-family: inherit; outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: #4b41e1; }
  .hint { font-size: 12px; color: #aaa; margin-top: .2rem; }
  .error { color: #e53935; font-size: 13px; min-height: 18px; margin-bottom: .5rem; font-weight: 600; }
  .success { color: #009668; font-size: 13px; min-height: 18px; margin-bottom: .5rem; font-weight: 600; }
  .btn-save {
    width: 100%; background: #111; color: #fff; border: none; border-radius: .5rem;
    padding: .8rem; font-size: 15px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: .4rem;
    transition: background .15s; margin-top: .5rem;
  }
  .btn-save:hover { background: #4b41e1; }
  .btn-back {
    display: flex; align-items: center; gap: .3rem;
    background: none; border: 1.5px solid #ddd; border-radius: .5rem;
    padding: .65rem 1.2rem; font-size: 14px; font-weight: 600; cursor: pointer;
    color: #555; text-decoration: none; margin-top: .75rem; justify-content: center;
    transition: border-color .15s;
  }
  .btn-back:hover { border-color: #4b41e1; color: #4b41e1; }

  .divider { border: none; border-top: 1px solid #eee; margin: 1.2rem 0; }

  .current-info {
    background: #f7f9fb; border-radius: .5rem; padding: .75rem 1rem;
    font-size: 13px; color: #555; margin-bottom: 1.2rem;
    display: flex; flex-direction: column; gap: .3rem;
  }
  .current-info span { font-weight: 700; color: #111; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="dailyCode.js"></script>

<header>
  <a href="admin.html" style="display:flex;align-items:center;gap:.3rem;font-size:14px;font-weight:600;color:#4b41e1;text-decoration:none;">
    <span class="material-symbols-outlined" style="font-size:20px;">arrow_back</span> Back
  </a>
  <a href="index.html" class="header-company">Jain Machinery Stores</a>
  <div style="width:80px;"></div>
</header>

<div class="card">
  <div class="card-title">
    <span class="material-symbols-outlined" style="font-size:22px;color:#4b41e1;">manage_accounts</span>
    Change Credentials
  </div>

  <div class="current-info" id="current-info">
    Current username: <span id="show-username">admin</span>
  </div>

  <div class="field">
    <label>Current Password *</label>
    <input type="password" id="cur-pass" placeholder="Enter your current password"/>
  </div>

  <hr class="divider"/>

  <div class="field">
    <label>New Username</label>
    <input type="text" id="new-user" placeholder="Leave blank to keep current"/>
  </div>

  <div class="field">
    <label>New Password</label>
    <input type="password" id="new-pass" placeholder="Leave blank to keep current"/>
  </div>

  <div class="field">
    <label>Confirm New Password</label>
    <input type="password" id="confirm-pass" placeholder="Re-enter new password"/>
  </div>

  <div class="error" id="err-msg"></div>
  <div class="success" id="ok-msg"></div>

  <button class="btn-save" onclick="saveCredentials()">
    <span class="material-symbols-outlined" style="font-size:18px;">save</span>
    Save Changes
  </button>

  <a href="admin.html" class="btn-back">
    <span class="material-symbols-outlined" style="font-size:16px;">arrow_back</span>
    Back to Admin Panel
  </a>
</div>

<script>
if (sessionStorage.getItem('qf_admin_logged_in') !== 'true') {
  window.location.href = 'login.html';
}

let _creds = { username: 'admin', password: 'admin123' };

async function loadCreds() {
  _creds.username = await dbGetSetting('admin_username', 'admin');
  _creds.password = await dbGetSetting('admin_password', 'admin123');
  document.getElementById('show-username').textContent = _creds.username;
}
loadCreds();

async function saveCredentials() {
  const curPass     = document.getElementById('cur-pass').value;
  const newUser     = document.getElementById('new-user').value.trim();
  const newPass     = document.getElementById('new-pass').value;
  const confirmPass = document.getElementById('confirm-pass').value;
  const errEl = document.getElementById('err-msg');
  const okEl  = document.getElementById('ok-msg');
  errEl.textContent = ''; okEl.textContent = '';

  if (!curPass) { errEl.textContent = 'Please enter your current password.'; return; }
  if (curPass !== _creds.password) { errEl.textContent = 'Current password is incorrect.'; return; }
  if (!newUser && !newPass) { errEl.textContent = 'Enter a new username or password to change.'; return; }
  if (newPass && newPass !== confirmPass) { errEl.textContent = 'New passwords do not match.'; return; }
  if (newPass && newPass.length < 4) { errEl.textContent = 'New password must be at least 4 characters.'; return; }

  if (newUser) { await dbSaveSetting('admin_username', newUser); _creds.username = newUser; }
  if (newPass) { await dbSaveSetting('admin_password', newPass); _creds.password = newPass; }

  document.getElementById('show-username').textContent = _creds.username;
  document.getElementById('cur-pass').value = '';
  document.getElementById('new-user').value = '';
  document.getElementById('new-pass').value = '';
  document.getElementById('confirm-pass').value = '';

  okEl.textContent = '✓ Credentials updated successfully!';
  setTimeout(() => { okEl.textContent = ''; }, 3000);
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') saveCredentials(); });
</script>
</body>
</html>
